name: Sosh
description: Sosh was a San Francisco-based social-discovery mobile app (founded 2010)
  that acted as a "social concierge," giving members a personalized collection of local
  activities, events, and places to do and share. It was backed by Battery Ventures and
  Khosla Ventures among others. Sosh was acqui-hired by on-demand delivery service Postmates
  in November 2015 and the consumer app was subsequently discontinued. Enrichment research
  (WebFetch) found no surviving product, developer portal, documentation, or public API;
  the sosh.com domain is now a parked "for sale" listing. There is no live API surface to
  enrich, so no API artifacts were produced.
